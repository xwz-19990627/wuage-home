<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📦 文件盒子 · 蛙哥家庭助手</title>
<style>
  :root { --bg:#FAF8F3; --card:#fff; --line:#EFEBE3; --ink:#2B2620; --sub:#9A937F; --accent:#D99025; --red:#D9534F; --green:#2E9E6B; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding-bottom:48px; }
  .wrap { max-width:560px; margin:0 auto; padding:14px; }
  h1 { font-size:18px; margin:0; }
  .sub { color:var(--sub); font-size:12px; margin:2px 0 0; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .back { color:var(--sub); font-size:13px; text-decoration:none; }
  .card { background:var(--card); border-radius:20px; box-shadow:0 2px 10px rgba(43,38,32,.05); padding:14px; margin:12px 0; }
  .card h2 { font-size:13px; color:var(--sub); font-weight:600; margin:0 0 10px; }
  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center; }
  .stat b { display:block; font-size:16px; margin-top:2px; font-weight:800; }
  .stat span { font-size:11px; color:var(--sub); }
  .bar { height:8px; background:#F1EBDF; border-radius:99px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s; }
  .bar-tip { font-size:11px; color:var(--sub); margin-top:6px; }
  .big-btn { display:block; width:100%; border:0; border-radius:16px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; }
  .big-btn:active { transform:scale(.98); }
  .hint { font-size:12px; color:var(--sub); margin:8px 0 0; }
  .progress { display:none; margin-top:10px; }
  .progress.on { display:block; }
  .progress .p-track { height:10px; background:#F1EBDF; border-radius:99px; overflow:hidden; }
  .progress .p-fill { height:100%; width:0; background:var(--green); border-radius:99px; transition:width .15s; }
  .progress .p-text { font-size:12px; color:var(--sub); margin-top:4px; word-break:break-all; }
  .day { font-size:12px; color:var(--sub); font-weight:600; margin:14px 2px 6px; }
  .file { display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--line); }
  .file:last-child { border-bottom:0; }
  .file .ico { font-size:18px; flex:0 0 auto; }
  .file .info { flex:1; min-width:0; }
  .file .name { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file .meta { font-size:11px; color:var(--sub); margin-top:2px; }
  .btn { border:0; border-radius:10px; padding:6px 10px; font-size:13px; cursor:pointer; flex:0 0 auto; }
  .btn:active { transform:scale(.96); }
  .btn.dl { background:#F1EBDF; color:#6B624C; text-decoration:none; }
  .btn.del { background:transparent; color:var(--red); }
  .empty { text-align:center; padding:26px 0 18px; color:var(--sub); }
  .empty .e-ico { font-size:34px; }
  .foot { text-align:center; color:var(--sub); font-size:11px; padding:10px 0 24px; line-height:1.8; }
  .foot a { color:var(--sub); }
  .toast { position:fixed; left:0; right:0; bottom:64px; display:flex; justify-content:center; pointer-events:none; }
  .toast div { background:rgba(43,38,32,.88); color:#fff; font-size:13px; border-radius:99px; padding:7px 14px; max-width:86vw; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>📦 文件盒子</h1><div class="sub">蛙哥家庭助手 · 工具 01 · 跨端文件互传</div></div>
    <a class="back" href="../home/">返回主页</a>
  </div>

  <div class="card">
    <h2>📊 空间使用</h2>
    <div class="stats">
      <div class="stat"><b id="st-count">-</b><span>文件数</span></div>
      <div class="stat"><b id="st-used">-</b><span>已用空间</span></div>
      <div class="stat"><b id="st-ret">-</b><span>保留天数</span></div>
    </div>
    <div class="bar"><i id="quota-fill" style="width:0"></i></div>
    <div class="bar-tip" id="quota-tip"></div>
  </div>

  <div class="card">
    <h2>⬆️ 上传文件</h2>
    <button class="big-btn" id="pick-btn">选择文件上传</button>
    <input type="file" id="file-input" multiple accept="*/*" style="display:none">
    <div class="hint" id="limit-hint"></div>
    <div class="hint">安卓选择器一般有「相机 / 相册 / 文件」三项；如果只有相机/相册，请改用 Chrome 或系统浏览器打开本页，即可选「文件」。</div>
    <div class="progress" id="progress">
      <div class="p-track"><div class="p-fill" id="p-fill"></div></div>
      <div class="p-text" id="p-text"></div>
    </div>
  </div>

  <div class="card">
    <h2>📁 服务器上的文件 <a id="cleanup-link" href="javascript:void 0" style="float:right;color:var(--sub);font-size:12px">立即清理超期</a></h2>
    <div id="file-list"></div>
  </div>

  <div class="foot">
    文件存在本服务器固定目录，<b>到期自动清理</b>、<b>删除即永久删除</b><br>
    迁移服务器 = 把 data/files 目录拷走即可<br>
    建议在 Wi-Fi 下传大文件
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var META = null;
var busy = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dayLabel(ms){
  var d = new Date(ms);
  var today = new Date(), yest = new Date(Date.now()-86400000);
  function key(x){ return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); }
  var k = key(d), kt = key(today), ky = key(yest);
  if (k === kt) return '今天';
  if (k === ky) return '昨天';
  if (d.getFullYear() === today.getFullYear()) return (d.getMonth()+1)+'月'+d.getDate()+'日';
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function timeLabel(ms){
  var d = new Date(ms);
  return pad(d.getHours())+':'+pad(d.getMinutes());
}
function toast(msg){
  var t = $('toast');
  t.innerHTML = '<div>'+esc(msg)+'</div>';
  t.style.display = 'flex';
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.style.display='none'; }, 2600);
}
function api(path, opt){
  return fetch(path, opt).then(function(res){
    if (!res.ok) {
      return res.json().then(function(j){
        throw new Error(j.error || ('请求失败 ('+res.status+')'));
      }).catch(function(e){
        if (e instanceof Error) throw e;
        throw new Error('请求失败 ('+res.status+')');
      });
    }
    return res.json();
  });
}

function renderMeta(){
  $('st-count').textContent = META.fileCount;
  $('st-used').textContent = fmtSize(META.usageBytes);
  $('st-ret').textContent = META.retentionDays + ' 天';
  var pct = Math.min(100, META.quotaMb ? META.usageBytes/1024/1024/META.quotaMb*100 : 0);
  $('quota-fill').style.width = pct.toFixed(1) + '%';
  var remain = Math.max(0, META.quotaMb - META.usageBytes/1024/1024);
  $('quota-tip').textContent = '已用 ' + (META.usageBytes/1024/1024).toFixed(1) + ' / ' + META.quotaMb + ' MB · 剩余约 ' + remain.toFixed(0) + ' MB · 单个文件 ≤ ' + META.maxMbPerFile + ' MB';
  $('limit-hint').textContent = '单个文件 ≤ ' + META.maxMbPerFile + ' MB，超过 ' + META.retentionDays + ' 天的文件会自动清理';
}

function renderList(){
  var box = $('file-list');
  if (!META || !META.files.length) {
    box.innerHTML = '<div class="empty"><div class="e-ico">📂</div>还没有文件<br>点上面的按钮上传第一个吧</div>';
    return;
  }
  var html = '', lastDay = '';
  META.files.forEach(function(f){
    var day = dayLabel(f.mtime);
    if (day !== lastDay) { html += '<div class="day">' + esc(day) + '</div>'; lastDay = day; }
    html += '<div class="file">'
      + '<div class="ico">📄</div>'
      + '<div class="info">'
      +   '<div class="name" title="' + esc(f.name) + '">' + esc(f.name) + '</div>'
      +   '<div class="meta">' + fmtSize(f.size) + ' · ' + timeLabel(f.mtime) + '</div>'
      + '</div>'
      + '<a class="btn dl" href="f/' + encodeURIComponent(f.name) + '">下载</a>'
      + '<button class="btn del" data-name="' + encodeURIComponent(f.name) + '">删除</button>'
      + '</div>';
  });
  box.innerHTML = html;
}

function loadAll(){
  return api('api/list').then(function(data){
    META = data;
    renderMeta();
    renderList();
  });
}

function uploadOne(file){
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'api/upload?name=' + encodeURIComponent(file.name));
    var p = $('progress'); p.className = 'progress on';
    xhr.upload.onprogress = function(e){
      if (e.lengthComputable) {
        $('p-fill').style.width = (e.loaded/e.total*100).toFixed(1) + '%';
        $('p-text').textContent = '正在上传：' + file.name + '（' + Math.round(e.loaded/e.total*100) + '%）';
      }
    };
    xhr.onload = function(){
      if (xhr.status >= 200 && xhr.status < 300) { resolve(); }
      else {
        var msg = '上传失败（' + xhr.status + '）';
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch(e){}
        reject(new Error(msg));
      }
    };
    xhr.onerror = function(){ reject(new Error('网络错误，上传中断')); };
    xhr.send(file);
  });
}

function uploadFiles(files){
  if (busy || !files.length) return;
  busy = true;
  var btn = $('pick-btn');
  btn.disabled = true; btn.textContent = '上传中…';
  var i = 0;
  function next(){
    if (i >= files.length) {
      busy = false;
      btn.disabled = false; btn.textContent = '选择文件上传';
      $('progress').className = 'progress';
      $('p-fill').style.width = '0';
      $('file-input').value = '';
      toast('全部上传完成');
      loadAll().catch(function(e){ toast(e.message); });
      return;
    }
    uploadOne(files[i]).then(function(){
      i++; next();
    }).catch(function(e){
      busy = false;
      btn.disabled = false; btn.textContent = '选择文件上传';
      $('progress').className = 'progress';
      toast(e.message);
      loadAll().catch(function(){});
    });
  }
  next();
}

function delFile(enc){
  var name = decodeURIComponent(enc);
  if (!window.confirm('确定永久删除「' + name + '」吗？')) return;
  api('api/delete?name=' + enc, { method: 'DELETE' }).then(function(){
    toast('已删除');
    loadAll().catch(function(e){ toast(e.message); });
  }).catch(function(e){ toast(e.message); });
}

$('file-input').addEventListener('change', function(){ uploadFiles(this.files); });
$('pick-btn').addEventListener('click', function(){ $('file-input').click(); });
$('file-list').addEventListener('click', function(ev){
  var b = ev.target;
  if (b && b.className === 'btn del') delFile(b.getAttribute('data-name'));
});
$('cleanup-link').addEventListener('click', function(){
  if (!window.confirm('立即删除超过保留期的文件？')) return;
  api('api/cleanup', { method: 'POST' }).then(function(data){
    toast(data.count ? ('已清理 ' + data.count + ' 个文件') : '没有需要清理的文件');
    loadAll().catch(function(){});
  }).catch(function(e){ toast(e.message); });
});

loadAll().catch(function(e){
  $('file-list').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  toast(e.message);
});
</script>
</body>
</html>
