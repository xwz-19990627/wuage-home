<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WuAge 家庭财务助手</title>
<style>
  :root { --bg:#FAF8F3; --card:#fff; --line:#EFEBE3; --ink:#2B2620; --sub:#9A937F; --accent:#D99025; --red:#D9534F; --green:#2E9E6B; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding-bottom:64px; }
  .wrap { max-width:480px; margin:0 auto; padding:14px; }
  h1 { font-size:17px; margin:2px 0; }
  .ver { color:var(--sub); font-size:11px; margin-left:6px; }
  .card { background:var(--card); border-radius:20px; box-shadow:0 2px 10px rgba(43,38,32,.05); padding:14px; margin:12px 0; }
  .card h2 { font-size:13px; color:var(--sub); font-weight:600; margin:0 0 8px; }
  .big { font-size:30px; font-weight:800; margin:2px 0; }
  .big small { font-size:13px; color:var(--sub); font-weight:400; }
  .delta { font-size:12px; color:var(--sub); }
  .delta.up { color:var(--red); } .delta.down { color:var(--green); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, select { padding:8px 10px; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:14px; color:var(--ink); }
  input:focus, select:focus { outline:2px solid #F3E0BE; }
  button { border:0; border-radius:12px; padding:9px 14px; font-size:14px; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; }
  .ghost { background:#F1EBDF; color:#6B624C; }
  .danger { background:transparent; color:var(--red); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:7px 4px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--sub); font-weight:600; font-size:11px; }
  td.num { text-align:right; }
  .amt-out { color:var(--red); font-weight:700; } .amt-in { color:var(--green); font-weight:700; }
  .tag { display:inline-block; background:#F6EBD7; color:#9A6A1E; border-radius:6px; padding:0 7px; font-size:12px; }
  .empty { color:var(--sub); text-align:center; padding:18px 0; }
  .bar { display:flex; align-items:center; gap:6px; margin:5px 0; }
  .bar .nm { width:60px; font-size:12px; text-align:right; color:var(--sub); flex:none; }
  .bar .tr { flex:1; background:#F4EFE4; border-radius:5px; height:12px; overflow:hidden; }
  .bar .fl { display:block; height:100%; background:var(--accent); border-radius:5px; min-width:3px; }
  .bar .vl { width:96px; font-size:11px; color:var(--sub); }
  .pie { width:130px; height:130px; border-radius:50%; margin:4px auto; }
  .legend { font-size:12px; color:var(--sub); margin-top:8px; }
  .legend b { color:var(--ink); }
  #tabbar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); display:flex; z-index:9; }
  #tabbar button { flex:1; padding:10px 0 8px; background:transparent; color:var(--sub); font-size:11px; border-radius:0; }
  #tabbar button.on { color:var(--accent); font-weight:700; }
  .view { display:none; } .view.on { display:block; }
  .hint { font-size:12px; color:var(--sub); margin:2px 0 0; }
  #ai-card { background:#FBF6EA; }
  .member-card { display:flex; justify-content:space-between; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); }
  .edit-row input, .edit-row select { padding:4px 6px; margin-right:5px; font-size:12px; }
  @media (max-width:360px){ .pie{ width:110px; height:110px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>WuAge 家庭财务助手<span class="ver" id="ver">v0.1.7-rc</span></h1>

  <!-- 首页 -->
  <div id="view-home" class="view on">
    <div class="card">
      <h2>本月支出 <span style="float:right"><select id="h-month" style="padding:5px"></select></span></h2>
      <div class="big" id="d-total">--</div>
      <div class="delta" id="d-delta"></div>
    </div>
    <div class="card">
      <h2>分类占比</h2>
      <div class="pie" id="d-pie"></div>
      <div class="legend" id="d-legend"></div>
    </div>
    <div class="card">
      <h2>近 7 日每日支出</h2>
      <div id="d-week"></div>
    </div>
  </div>

  <!-- AI 记账 -->
  <div id="view-ai" class="view">
    <div class="card">
      <h2>AI 记账</h2>
      <div class="row">
        <input id="f-text" type="text" style="flex:1;min-width:240px" placeholder="一句话记账，如：今天妈妈买菜花了86元">
        <button class="primary" id="btn-parse">解析</button>
        <button class="ghost" id="btn-toggle-manual">手动</button>
      </div>
      <div class="hint" id="parse-hint"></div>
      <div id="ai-card" class="card" style="display:none">
        <h2>AI 解析结果 <span class="tag" id="ai-conf"></span></h2>
        <div id="ai-fields">
          <div id="ai-view" style="margin-bottom:8px"></div>
          <div class="row">
            <button class="primary" id="btn-confirm">确认记账</button>
            <button class="ghost" id="btn-edit">修改</button>
            <button class="ghost" id="btn-cancel">取消</button>
          </div>
        </div>
        <div id="ai-edit" style="display:none">
          <div class="row" style="margin-bottom:8px">
            <input id="e-amount" type="number" step="0.01" min="0.01" style="width:76px" placeholder="金额">
            <input id="e-date" type="date">
            <select id="e-category"></select>
            <select id="e-member"></select>
            <input id="e-merchant" type="text" placeholder="商户" style="width:90px">
            <input id="e-note" type="text" placeholder="备注" style="flex:1;min-width:140px">
          </div>
          <div class="row">
            <button class="primary" id="btn-edit-save">保存修改</button>
            <button class="ghost" id="btn-edit-cancel">取消编辑</button>
          </div>
        </div>
      </div>
      <div class="row" id="draft-bar" style="display:none;margin-top:8px">
        <span class="hint">💾 有未完成的记账草稿（24h 内有效）</span>
        <button class="ghost" id="btn-draft-resume">恢复</button>
        <button class="ghost" id="btn-draft-drop">丢弃</button>
      </div>
      <div class="row" id="manual-box" style="display:none;margin-top:8px">
        <input id="f-amount" type="number" step="0.01" min="0.01" placeholder="金额(元)" style="width:100px">
        <input id="f-date" type="date">
        <select id="f-category"></select>
        <input id="f-note" type="text" placeholder="备注" style="flex:1">
        <button class="primary" id="btn-add">保存</button>
      </div>
    </div>
  </div>

  <!-- 账单 -->
  <div id="view-bills" class="view">
    <div class="card">
      <h2>账单</h2>
      <div class="row" style="margin-bottom:6px">
        <select id="f-range"><option value="all">全部</option><option value="today">今天</option><option value="7d">近7天</option><option value="month">本月</option><option value="custom">自定义</option></select>
        <input id="f-from" type="date" style="display:none"> ~ <input id="f-to" type="date" style="display:none">
        <select id="f-cat"><option value="">全部类别</option></select>
        <select id="f-mem"><option value="">全部成员</option></select>
      </div>
      <table><thead><tr><th>日期</th><th>分类</th><th class="num">金额</th><th>备注</th><th>操作</th></tr></thead><tbody id="bill-rows"></tbody></table>
      <div class="hint" style="text-align:right" id="bill-total"></div>
    </div>
  </div>

  <!-- 家庭 -->
  <div id="view-family" class="view">
    <div class="card">
      <h2>家庭成员 <button class="ghost" style="float:right;padding:4px 10px" id="btn-new-member">+ 新增</button></h2>
      <div id="member-list"></div>
    </div>
    <div class="card" id="member-form" style="display:none">
      <h2>新增成员</h2>
      <div class="row">
        <input id="m-name" type="text" placeholder="姓名（必填）">
        <input id="m-relation" type="text" placeholder="关系（选填）">
        <button class="primary" id="btn-member-save">保存</button>
        <button class="ghost" id="btn-member-cancel">取消</button>
      </div>
    </div>
  </div>
</div>

<nav id="tabbar">
  <button class="on" data-view="home">首页</button>
  <button data-view="ai">AI记账</button>
  <button data-view="bills">账单</button>
  <button data-view="family">家庭</button>
</nav>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var CATS = [], MEMS = [], CURRENT = null, DRAFT_ID = null;
  var COLORS = ["#D99025","#4A6FA5","#2E9E6B","#C0565A","#8B5E9E","#0E9AA7","#D97706","#A5678F","#6B7280","#9A937F"];

  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function yuan(c){return (c/100).toFixed(2);}
  function fmt(d){var m=String(d.getMonth()+1);if(m.length<2)m="0"+m;var day=String(d.getDate());if(day.length<2)day="0"+day;return d.getFullYear()+"-"+m+"-"+day;}
  function todayS(){return fmt(new Date());}
  function fillSelect(sel,opts,selv){sel.innerHTML="";opts.forEach(function(o){var v=(typeof o==="object")?o.value:o,t=(typeof o==="object")?o.text:o;var x=document.createElement("option");x.value=v;x.textContent=t;if(v===selv)x.selected=true;sel.appendChild(x);});}

  function showView(id){
    document.querySelectorAll(".view").forEach(function(v){v.classList.remove("on");});
    document.getElementById("view-"+id).classList.add("on");
    document.querySelectorAll("#tabbar button").forEach(function(b){b.classList.toggle("on",b.dataset.view===id);});
    if(id==="home") loadDashboard();
    if(id==="bills") loadBills();
    if(id==="family") loadFamily();
  }
  document.addEventListener("click",function(ev){
    var btn=ev.target.closest?ev.target.closest("button"):null;
    if(btn&&btn.dataset&&btn.dataset.view){showView(btn.dataset.view);return;}
    var tb=ev.target.closest?ev.target.closest("#tabbar button"):null;
    if(tb){return;}
  });
  ["home","ai","bills","family"].forEach(function(v){
    document.querySelector("#tabbar button[data-view="+v+"]").addEventListener("click",function(){showView(v);});
  });

  function loadMeta(){
    return fetch("api/health").then(function(r){return r.json();}).then(function(h){
      CATS=h.categories||[];fillSelect($("f-category"),[""].concat(CATS),"");
      fillSelect($("f-cat"),[""].concat(CATS),"");
      fillSelect($("f-category"),CATS,"餐饮");
      return fetch("api/members").then(function(m){return m.json();}).then(function(d){
        MEMS=(d.members||[]).map(function(x){return x.name;});
        fillSelect($("f-mem"),[""].concat(MEMS),"");
      });
    }).catch(function(e){$("ver").textContent="连接后端失败："+e;});
  }

  // ── 首页 Dashboard ────────────────────────────────────────────────
  function loadDashboard(){
    var off=$("h-month").value?parseInt($("h-month").dataset.offset,10):0;
    fetch("api/dashboard?offset="+off).then(function(r){return r.json();}).then(function(d){
      $("d-total").innerHTML=yuan(d.month_total_cents)+" <small>元 · "+d.count+" 笔</small>";
      var dl=$("d-delta");
      if(d.change_pct===null){dl.textContent="上月无支出记录";}
      else{dl.innerHTML=(d.change_pct>0?"📈 较上月 ↑":"📉 较上月 ↓")+Math.abs(d.change_pct)+"%";dl.className="delta "+(d.change_pct>0?"up":"down");}
      var total=d.month_total_cents||1;
      var shares=d.cat_share||[];
      if(!shares.length){$("d-pie").style.background="#F4EFE4";$("d-legend").innerHTML="<div class=empty>本月还没有记账</div>";$("d-week").innerHTML="<div class=empty>本月还没有记账</div>";return;}
      var grad=[],acc=0,lh="";
      shares.forEach(function(s,i){var p=Math.round(s.total_cents/total*100);grad.push(COLORS[i%COLORS.length]+" "+acc+"% "+(acc+p)+"%");lh+="<div><span style='display:inline-block;width:9px;height:9px;border-radius:2px;background:"+COLORS[i%COLORS.length]+"'></span> "+esc(s.name)+" <b>"+yuan(s.total_cents)+" 元</b>（"+p+"%）</div>";acc+=p;});
      $("d-pie").style.background="conic-gradient("+grad.join(",")+")";
      $("d-legend").innerHTML=lh;
      var w=d.last7||[],max=Math.max.apply(null,w.map(function(x){return x.total_cents;}))||1,h="";
      w.forEach(function(x){var p=Math.round(x.total_cents/max*100);h+="<div class=bar><span class=nm>"+x.date.slice(5)+"</span><span class=tr><span class=fl style='width:"+p+"%;background:"+COLORS[(x.date.slice(8)-1)%COLORS.length]+"'></span></span><span class=vl>"+yuan(x.total_cents)+"</span></div>";});
      $("d-week").innerHTML=h;
    }).catch(function(e){$("d-total").textContent="加载失败";});
  }
  function initMonthSelect(){
    var sel=$("h-month"),now=new Date();
    for(var i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);var o=document.createElement("option");o.value=d.toISOString().slice(0,7);o.textContent=d.getFullYear()+"年"+(d.getMonth()+1)+"月";o.dataset.offset=String(i);if(i===0)o.selected=true;sel.appendChild(o);}
    sel.addEventListener("change",function(){loadDashboard();});
  }

  // ── AI 记账（结果卡 + 草稿） ──────────────────────────────────────
  function smartAdd(){
    var text=$("f-text").value.trim();
    if(!text){$("parse-hint").textContent="先输入一句话，比如：今天妈妈买菜花了86元";return;}
    $("parse-hint").textContent="🤔 大模型解析中…";
    fetch("api/parse",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text})})
      .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
      .then(function(res){
        if(!res.ok){$("parse-hint").textContent="❌ "+(res.d.error||"解析失败");return;}
        CURRENT=res.d.parsed;showCard(CURRENT);saveDraft(CURRENT);$("f-text").value="";
      }).catch(function(e){$("parse-hint").textContent="❌ 解析失败："+e;});
  }
  function showCard(p){
    $("ai-conf").textContent="置信度 "+Math.round((p.ai_confidence||0.8)*100)+"%";
    $("ai-view").innerHTML="金额 <b>"+yuan(p.amount_cents)+"</b> 元 · "+esc(p.date)+" · [<b>"+esc(p.category)+"</b>] · "+esc(p.member||"本人")+(p.merchant?" · 🏪 "+esc(p.merchant):"")+" · "+esc(p.note);
    $("ai-card").style.display="";$("ai-fields").style.display="";$("ai-edit").style.display="none";$("parse-hint").textContent="";
    fillSelect($("e-category"),CATS,p.category);
    var memOpts=[p.member||"本人"].concat(MEMS.filter(function(m){return m!==(p.member||"本人");}));
    fillSelect($("e-member"),memOpts,p.member||"本人");
    $("e-amount").value=(p.amount_cents/100).toFixed(2);$("e-date").value=p.date;$("e-merchant").value=p.merchant||"";$("e-note").value=p.note||"";
  }
  function hideCard(){$("ai-card").style.display="none";CURRENT=null;}
  function saveDraft(p){fetch("api/drafts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:p})}).then(function(r){return r.json();}).then(function(d){if(d&&d.id)DRAFT_ID=d.id;}).catch(function(){});}
  function dropDraft(){if(DRAFT_ID){fetch("api/drafts/"+DRAFT_ID,{method:"DELETE"}).catch(function(){});DRAFT_ID=null;}}
  function confirmSave(){
    if(!CURRENT)return;
    var body={};
    ["amount_cents","date","kind","category","member","merchant","note","tags"].forEach(function(k){body[k]=CURRENT[k];});
    body.source="ai_parsed";body.channel="manual";body.raw_text=CURRENT.note;body.ai_confidence=CURRENT.ai_confidence;
    fetch("api/entries",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
      .then(function(res){
        if(!res.ok){alert("保存失败："+(res.d.error||""));return;}
        dropDraft();hideCard();$("parse-hint").textContent="✅ 已确认记账：["+res.d.category+"] "+yuan(res.d.amount_cents)+" 元";loadBills();
      }).catch(function(e){alert("保存失败："+e);});
  }
  function startEditCard(){$("ai-fields").style.display="none";$("ai-edit").style.display="";}
  function saveEditCard(){
    var amt=parseFloat($("e-amount").value);if(!(amt>0)){alert("金额不对");return;}if(!CURRENT)return;
    CURRENT.amount_cents=Math.round(amt*100);CURRENT.date=$("e-date").value||CURRENT.date;CURRENT.category=$("e-category").value;
    CURRENT.member=$("e-member").value;CURRENT.merchant=$("e-merchant").value.trim()||null;CURRENT.note=$("e-note").value.trim();
    showCard(CURRENT);saveDraft(CURRENT);$("parse-hint").textContent="已更新，请再次确认";
  }
  function cancelCard(){dropDraft();hideCard();$("parse-hint").textContent="";}
  function checkDraft(){
    fetch("api/drafts").then(function(r){return r.json();}).then(function(d){
      var ds=d.drafts||[];if(!ds.length)return;
      var last=ds[0];$("draft-bar").style.display="";
      $("btn-draft-resume").onclick=function(){DRAFT_ID=last.id;CURRENT=last.data;showCard(CURRENT);$("draft-bar").style.display="none";$("parse-hint").textContent="已恢复草稿（确认记账将保存，取消将丢弃）";};
      $("btn-draft-drop").onclick=function(){fetch("api/drafts/"+last.id,{method:"DELETE"}).catch(function(){});$("draft-bar").style.display="none";};
    }).catch(function(){});
  }
  function manualAdd(){
    var amt=parseFloat($("f-amount").value);if(!(amt>0)){alert("金额不对");return;}
    fetch("api/entries",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount_cents:Math.round(amt*100),date:$("f-date").value||undefined,category:$("f-category").value,note:$("f-note").value.trim()})})
      .then(function(r){return r.json();}).then(function(d){if(d.error){alert("失败："+d.error);return;}$("f-amount").value="";$("f-note").value="";alert("✅ 已保存");loadBills();}).catch(function(e){alert(e);});
  }

  // ── 账单 ───────────────────────────────────────────────────────────
  function rangeQ(){
    var t=new Date(),v=$("f-range").value;
    if(v==="today")return "from="+fmt(t)+"&to="+fmt(t);
    if(v==="7d"){var f=new Date(t);f.setDate(f.getDate()-6);return "from="+fmt(f)+"&to="+fmt(t);}
    if(v==="month")return "from="+fmt(new Date(t.getFullYear(),t.getMonth(),1))+"&to="+fmt(t);
    if(v==="custom"&&$("f-from").value&&$("f-to").value)return "from="+$("f-from").value+"&to="+$("f-to").value;
    return "";
  }
  function loadBills(){
    var q=rangeQ();
    if($("f-cat").value)q+="&category="+encodeURIComponent($("f-cat").value);
    if($("f-mem").value)q+="&member="+encodeURIComponent($("f-mem").value);
    fetch("api/entries?"+q).then(function(r){return r.json();}).then(function(d){
      var rows=d.entries||[],tb=$("bill-rows");tb.innerHTML="";
      var total=rows.reduce(function(s,r){return s+r.amount_cents;},0);
      $("bill-total").textContent=rows.length?("合计 "+yuan(total)+" 元 · "+rows.length+" 笔"):"";
      if(!rows.length){tb.innerHTML="<tr><td colspan=5 class=empty>暂无账单，试试用 AI 记一笔吧</td></tr>";return;}
      rows.forEach(function(r){
        var tr=document.createElement("tr");tr.dataset.id=r.id;
        tr.innerHTML="<td>"+esc(r.date)+"</td><td><span class=tag>"+esc(r.category)+"</span></td>"+
          "<td class='num "+(r.kind==="income"?"amt-in":"amt-out")+"'>"+(r.kind==="income"?"+":"-")+yuan(r.amount_cents)+"</td>"+
          "<td>"+esc(r.note)+"<br><span style=color:#9A937F;font-size:11px>"+esc(r.member||"本人")+(r.merchant?" · "+esc(r.merchant):"")+"</span></td>"+
          "<td><button class='ghost' data-a=edit>改</button> <button class='danger' data-a=del>删</button></td>";
        tb.appendChild(tr);
      });
    }).catch(function(e){});
  }
  document.addEventListener("click",function(ev){
    var b=ev.target.closest?ev.target.closest("button[data-a]"):null;
    if(!b)return;
    var tr=b.closest("tr");
    if(b.dataset.a==="del"){if(!confirm("删除这笔？"))return;fetch("api/entries/"+tr.dataset.id,{method:"DELETE"}).then(function(){loadBills();});return;}
    if(b.dataset.a==="edit"){
      var d=tr.children[0].textContent.trim(),c=tr.children[1].textContent.trim(),amt=parseFloat(tr.children[2].textContent.replace(/[^0-9.]/g,"")),note=tr.children[3].firstChild?tr.children[3].firstChild.textContent:"";
      tr.innerHTML="";var td=document.createElement("td");td.colSpan=5;td.className="edit-row";
      var di=document.createElement("input");di.type="date";di.value=d;
      var cs=document.createElement("select");fillSelect(cs,CATS,c);
      var ai=document.createElement("input");ai.type="number";ai.step="0.01";ai.value=amt.toFixed(2);ai.style.width="76px";
      var ni=document.createElement("input");ni.type="text";ni.value=note;
      var sa=document.createElement("button");sa.className="primary";sa.textContent="存";
      var ca=document.createElement("button");ca.className="ghost";ca.textContent="撤";
      sa.onclick=function(){fetch("api/entries/"+tr.dataset.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({category:cs.value,note:ni.value.trim(),date:di.value,amount_cents:Math.round(parseFloat(ai.value)*100)})}).then(function(){loadBills();});};
      ca.onclick=loadBills;
      td.appendChild(di);td.appendChild(cs);td.appendChild(ai);td.appendChild(ni);td.appendChild(sa);td.appendChild(ca);tr.appendChild(td);
    }
  });

  // ── 家庭 ───────────────────────────────────────────────────────────
  function loadFamily(){
    fetch("api/dashboard?offset=0").then(function(r){return r.json();}).then(function(dd){
      var spend={};dd.members.forEach(function(m){spend[m.name]=m.total_cents;});
      fetch("api/members").then(function(r){return r.json();}).then(function(d){
        var el=$("member-list");el.innerHTML="";
        (d.members||[]).forEach(function(m){
          var div=document.createElement("div");div.className="member-card";
          div.innerHTML="<span><b>"+esc(m.name)+"</b>"+(m.relation?" <span style='color:#9A937F;font-size:12px'>（"+esc(m.relation)+"）</span>":"")+"</span>"+
            "<span style='font-weight:700;color:#B7791F'>本月 "+yuan(spend[m.name]||0)+" 元</span>"+
            (m.name==="本人"?"":"<button class='danger' data-mid='"+m.id+"'>移除</button>");
          el.appendChild(div);
        });
        el.querySelectorAll("button[data-mid]").forEach(function(b){
          b.onclick=function(){
            if(!confirm("移除该成员？"))return;
            fetch("api/members/"+b.dataset.mid,{method:"DELETE"}).then(function(r){return r.json();}).then(function(d){
              if(d.error){alert(d.error);return;}loadFamily();
            });
          };
        });
      });
    });
  }
  $("btn-new-member").onclick=function(){$("member-form").style.display=$("member-form").style.display==="none"?"":"none";};
  $("btn-member-save").onclick=function(){
    var n=$("m-name").value.trim();if(!n){alert("姓名必填");return;}
    fetch("api/members",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,relation:$("m-relation").value.trim()||null})})
      .then(function(r){return r.json();}).then(function(d){if(d.error){alert(d.error);return;}$("m-name").value="";$("m-relation").value="";$("member-form").style.display="none";loadFamily();});
  };
  $("btn-member-cancel").onclick=function(){$("member-form").style.display="none";};

  // 事件绑定
  $("btn-parse").onclick=smartAdd;
  $("btn-confirm").onclick=confirmSave;
  $("btn-edit").onclick=startEditCard;
  $("btn-cancel").onclick=cancelCard;
  $("btn-edit-save").onclick=saveEditCard;
  $("btn-edit-cancel").onclick=function(){if(CURRENT)showCard(CURRENT);};
  $("btn-add").onclick=manualAdd;
  $("btn-toggle-manual").onclick=function(){$("manual-box").style.display=$("manual-box").style.display==="none"?"":"none";};
  ["f-cat","f-mem","f-range","f-from","f-to"].forEach(function(id){$(id).addEventListener("change",function(){if(id==="f-range"){var c=$("f-range").value==="custom";$("f-from").style.display=c?"":"none";$("f-to").style.display=c?"":"none";}loadBills();});});

  $("f-date").value=todayS();
  initMonthSelect();
  loadMeta().then(function(){checkDraft();showView("home");});
})();
</script>
</body>
</html>
