<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🧰 工具箱 · 蛙哥家庭助手</title>
<style>
  :root { --bg:#FAF8F3; --card:#fff; --line:#EFEBE3; --ink:#2B2620; --sub:#9A937F; --accent:#D99025; --green:#2E9E6B; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding-bottom:48px; }
  .wrap { max-width:560px; margin:0 auto; padding:14px; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  h1 { font-size:18px; margin:0; }
  .sub { color:var(--sub); font-size:12px; margin:2px 0 0; }
  .back { color:var(--sub); font-size:13px; text-decoration:none; }
  .card { background:var(--card); border-radius:20px; box-shadow:0 2px 10px rgba(43,38,32,.05); padding:14px; margin:12px 0; }
  .card h2 { font-size:13px; color:var(--sub); font-weight:600; margin:0 0 10px; }
  .tool-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tool-card { display:block; text-decoration:none; color:inherit; background:#FDFCF9; border:1px solid var(--line); border-radius:16px; padding:14px 8px; text-align:center; cursor:pointer; transition:transform .15s ease; }
  .tool-card:active { transform:scale(.97); }
  .tc-ico { font-size:30px; }
  .tc-name { font-size:15px; font-weight:700; margin-top:4px; }
  .tc-sub { font-size:11px; color:var(--sub); }
  .empty { text-align:center; padding:26px 0 18px; color:var(--sub); }
  .foot { text-align:center; color:var(--sub); font-size:11px; padding:10px 0 24px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🧰 工具箱</h1><div class="sub">蛙哥家庭助手 · 工具入口</div></div>
    <a class="back" href="/home/">返回主页</a>
  </div>

  <div class="card">
    <h2>我的工具</h2>
    <div class="tool-grid">
      <a class="tool-card" href="/home/files/">
        <div class="tc-ico">📦</div>
        <div class="tc-name">文件盒子</div>
        <div class="tc-sub">跨端文件互传/上传下载 · 已上线</div>
      </a>
      <a class="tool-card" href="/home/finance/">
        <div class="tc-ico">📈</div>
        <div class="tc-name">理财助手</div>
        <div class="tc-sub">持仓/行情/复盘/回测/笔记 · MVP</div>
      </a>
      <a class="tool-card" href="/home/health/">
        <div class="tc-ico">🏥</div>
        <div class="tc-name">健康助手</div>
        <div class="tc-sub">体检指标/日常记录/饮食运动规划 · 已上线</div>
      </a>
    </div>
  </div>

  <div class="foot">
    每个工具数据独立存放，迁移服务器 = 拷贝对应 data 目录
  </div>
</div>
</body>
</html>
